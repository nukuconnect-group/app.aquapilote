<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5, user-scalable=yes" />

    <!-- Application mobile native — bloquer toute indexation moteurs de recherche -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="bingbot" content="noindex, nofollow" />
    
    <!-- iOS Safari Optimizations -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aqua Pilot" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#047857" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- iOS Splash Screens -->
    <link rel="apple-touch-startup-image" href="/favicon.png" />
    
    <!-- Prevent iOS from caching aggressively -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- iOS PWA Icons -->
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/favicon.png" />
    
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preload" as="image" href="/assets/aqua-pilot-logo-small.webp" fetchpriority="high" type="image/webp" />
    <link rel="manifest" href="/manifest.json" />
    <title>AQUA PILOT - Gestion Aquacole Intelligente</title>
    <meta name="description" content="Application professionnelle de gestion aquacole avec monitoring IoT et analytics avancés">
    <meta name="author" content="AQUA PILOT Team" />
    
    <script>
      // Service Worker silencieux sans notifications
      if ('serviceWorker' in navigator) {
        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
        
        const registerSW = () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(() => {
              // Enregistrement silencieux - pas de notifications
            })
            .catch(() => {
              // Erreur silencieuse
            });
        };
        
        if (isIOS) {
          setTimeout(registerSW, 2000);
        } else {
          registerSW();
        }
      }
      
      // Supprimer toutes les erreurs non critiques
      window.addEventListener('error', (e) => {
        if (e.message?.includes('LockManager') || e.message?.includes('ServiceWorker')) {
          e.preventDefault();
          return false;
        }
      });
      
      window.addEventListener('unhandledrejection', (e) => {
        if (e.reason?.message?.includes('LockManager') || 
            e.reason?.message?.includes('ServiceWorker')) {
          e.preventDefault();
          return false;
        }
      });
    </script>

    
    
    <link rel="icon" type="image/png" href="/favicon.png">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
